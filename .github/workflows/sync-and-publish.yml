name: Sync upstream and publish image

on:
  schedule:
    - cron: '0 4 * * *'   # 4 AM UTC nightly
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Publish image even when there are no pending upstream changes'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'Skip the test gate (only safe right after a recent green run)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: feature/acquisition
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/grimmory-tools/grimmory.git
          git fetch upstream main

      - name: Decide whether to merge and publish
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            has_upstream_changes=false
          else
            has_upstream_changes=true
          fi

          force_publish="${{ inputs.force_publish }}"

          # force_publish bypasses the merge entirely — just ship current HEAD.
          # Otherwise: only merge/publish when upstream has actually moved.
          if [ "$force_publish" = "true" ]; then
            merge=false
            publish=true
          elif [ "$has_upstream_changes" = "true" ]; then
            merge=true
            publish=true
          else
            merge=false
            publish=false
          fi

          if [ "${{ inputs.skip_tests }}" = "true" ] || [ "$publish" != "true" ]; then
            run_tests=false
          else
            run_tests=true
          fi

          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "run_tests=$run_tests" >> "$GITHUB_OUTPUT"

      - name: Set Up JDK 25
        if: steps.check.outputs.merge == 'true' || steps.check.outputs.run_tests == 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Merge upstream main
        if: steps.check.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git merge upstream/main --no-edit; then
            exit 0
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

          # A lone gradle.lockfile conflict is pure churn: our build.gradle.kts
          # additions merged cleanly, so take upstream's lockfile and regenerate
          # it from the merged dependency declarations.
          if [ "${#conflicts[@]}" -eq 1 ] && [ "${conflicts[0]}" = "backend/gradle.lockfile" ]; then
            echo "Only backend/gradle.lockfile conflicts — regenerating from merged build.gradle.kts."
            git checkout --theirs backend/gradle.lockfile
            (cd backend && ./gradlew dependencies --write-locks -q)
            git add backend/gradle.lockfile
            git commit --no-edit
            exit 0
          fi

          {
            echo "## Nightly upstream sync blocked by merge conflicts"
            echo
            echo "\`git merge upstream/main\` into \`feature/acquisition\` conflicted in:"
            echo
            printf -- '- `%s`\n' "${conflicts[@]}"
            echo
            echo "Resolve locally, test, and push; the next nightly run will then proceed:"
            echo '```'
            echo "git fetch upstream main"
            echo "git checkout feature/acquisition"
            echo "git merge upstream/main"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > /tmp/conflict-report.md

          open_issues=$(gh issue list --state open --search 'in:title "Upstream sync blocked"' --json number --jq 'length' || echo 1)
          if [ "$open_issues" -eq 0 ]; then
            gh issue create \
              --title "Upstream sync blocked by merge conflicts" \
              --body-file /tmp/conflict-report.md || true
          else
            echo "An open sync-conflict issue already exists — not filing another."
          fi

          git merge --abort
          exit 1

      - name: Fix Flyway version collisions
        if: steps.check.outputs.merge == 'true'
        run: |
          chmod +x .github/scripts/renumber-migrations.sh
          .github/scripts/renumber-migrations.sh

      - name: Commit renumbered migrations (if any)
        if: steps.check.outputs.merge == 'true'
        run: |
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

      # ─── Test gate: backend + frontend must pass before push/publish ──────

      - name: Install just
        if: steps.check.outputs.run_tests == 'true'
        uses: taiki-e/install-action@5f57d6cb7cd20b14a8a27f522884c4bc8a187458 # v2.75.19
        with:
          tool: just

      - name: Install libarchive (NightCompress dep)
        if: steps.check.outputs.run_tests == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install libarchive-dev --yes
          sudo mkdir -p /usr/java/packages/lib/
          sudo cp /usr/lib/x86_64-linux-gnu/libarchive.* /usr/java/packages/lib/

      - name: Run Backend Tests
        if: steps.check.outputs.run_tests == 'true'
        run: just api test

      - name: Set Up Node.js
        if: steps.check.outputs.run_tests == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'

      - name: Enable Corepack
        if: steps.check.outputs.run_tests == 'true'
        run: |
          corepack enable
          corepack pnpm --version

      - name: Install Frontend Dependencies
        if: steps.check.outputs.run_tests == 'true'
        run: just ui install-ci

      - name: Run Frontend Tests
        if: steps.check.outputs.run_tests == 'true'
        id: frontend_tests
        continue-on-error: true
        run: just ui test

      - name: Validate Frontend Failures Against Allowlist
        if: steps.check.outputs.run_tests == 'true'
        run: |
          python3 .github/scripts/validate-test-allowlist.py \
            --xml frontend/test-results/vitest-results.xml \
            --allowlist .github/known-failing-tests.txt

      # ─── Push and publish (only reached if tests passed) ──────────────────

      - name: Resolve current SHA
        if: steps.check.outputs.publish == 'true'
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push merged branch
        if: steps.check.outputs.merge == 'true'
        run: git push origin feature/acquisition

      - name: Set up Docker Buildx
        if: steps.check.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.check.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/jstoneky/grimmory:latest
            ghcr.io/jstoneky/grimmory:${{ steps.head.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
