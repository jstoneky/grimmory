name: Sync upstream and publish image

on:
  schedule:
    - cron: '0 4 * * *'   # 4 AM UTC nightly
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: feature/acquisition
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/grimmory-tools/grimmory.git
          git fetch upstream main

      - name: Check for upstream changes
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream main
        if: steps.check.outputs.changed == 'true'
        run: git merge upstream/main --no-edit

      - name: Fix Flyway version collisions
        if: steps.check.outputs.changed == 'true'
        run: |
          chmod +x .github/scripts/renumber-migrations.sh
          .github/scripts/renumber-migrations.sh

      - name: Commit renumbered migrations (if any)
        if: steps.check.outputs.changed == 'true'
        run: |
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

      - name: Push merged branch
        if: steps.check.outputs.changed == 'true'
        run: git push origin feature/acquisition

      - name: Set up Docker Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jstoneky/grimmory:latest
            ghcr.io/jstoneky/grimmory:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
